name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    # Define environment variables needed for the build/tests to run
    # For a real deployment, these should be added to GitHub Secrets
    env:
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      DATABASE_URL: "file:santaan.db" # Using a local sqlite for CI testing
      BETTER_AUTH_SECRET: "ci-dummy-secret-key-do-not-use-in-prod"
      
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Build
      run: npm run build
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
